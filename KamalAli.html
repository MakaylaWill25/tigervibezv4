<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kamal Ali</title>
<link href="JohnDoe.css" rel="stylesheet"/>
</head>
<body>
<nav class="navbar">
<h1><a href="tigervibez.html">TigerVibez</a></h1>
<section>
<div class="search-container">
<input class="search-bar" placeholder="Search..." type="text"/>
<button class="search-button" onclick="searchFile()">Search</button>
</div>
</section>
</nav>
<div class="container">
<div class="name">Kamal Ali</div>
<div class="description">Hello, my name is Kamal Ali and I teach in the Industrial Systems &amp; Technology.</div>
</div>
<!-- Pie Chart Container -->
<div class="pie-chart-container">
<div class="pie-chart" id="pieChart">0%</div>
<!-- Labels for Pass and Fail -->
<div class="pie-chart-labels">
<div class="label-item">
<div class="color-box" style="background-color: green;"></div>
                Pass
            </div>
<div class="label-item">
<div class="color-box" style="background-color: red;"></div>
                Fail
            </div>
</div>
</div>
<!-- Comment Section -->
<div class="comment-section">
<h2>Reviews</h2>
<div class="overall" id="overallRating">Overall Rating: No ratings yet</div>
<textarea class="comment-box" id="commentInput" placeholder="Leave a comment..."></textarea>
<!-- Star Rating System -->
<div class="star-rating">
<span class="star" data-value="1">★</span>
<span class="star" data-value="2">★</span>
<span class="star" data-value="3">★</span>
<span class="star" data-value="4">★</span>
<span class="star" data-value="5">★</span>
</div>
<button class="submit-comment" onclick="submitComment()">Post Comment</button>
<div class="comments-list" id="commentsList"></div>
</div>
<script>
        let selectedRating = 0;
        let ratings = []; // Initialize ratings array

        // Handle star selection
        document.querySelectorAll('.star').forEach(star => {
            star.addEventListener('click', function() {
                selectedRating = parseInt(this.getAttribute('data-value'));
                updateStars();
            });

            star.addEventListener('mouseover', function() {
                const value = parseInt(this.getAttribute('data-value'));
                highlightStars(value);
            });

            star.addEventListener('mouseout', function() {
                updateStars();
            });
        });

        function highlightStars(rating) {
            document.querySelectorAll('.star').forEach(star => {
                if (parseInt(star.getAttribute('data-value')) <= rating) {
                    star.style.color = 'gold';
                } else {
                    star.style.color = '#ccc';
                }
            });
        }

        function updateStars() {
            document.querySelectorAll('.star').forEach(star => {
                if (parseInt(star.getAttribute('data-value')) <= selectedRating) {
                    star.classList.add('selected');
                } else {
                    star.classList.remove('selected');
                }
            });
        }

        function updateOverallRating() {
            if (ratings.length === 0) {
                document.getElementById("overallRating").innerText = "Overall Rating: No ratings yet";
                return;
            }
            let avgRating = (ratings.reduce((a, b) => a + b, 0) / ratings.length).toFixed(1);
            document.getElementById("overallRating").innerHTML = `Overall Rating: ${avgRating} ⭐`;
        }

        function generateRandomPie() {
            let passPercentage = Math.floor(Math.random() * 101); // Random 0-100
            let failPercentage = 100 - passPercentage;
            
            let pieChart = document.getElementById("pieChart");
            pieChart.innerText = passPercentage + "%";

            pieChart.style.background = `conic-gradient(
                green 0deg ${passPercentage * 3.6}deg,  
                red ${passPercentage * 3.6}deg 360deg
            )`;

            // Animate color change
            pieChart.style.transform = "scale(1.1)";
            setTimeout(() => pieChart.style.transform = "scale(1)", 300);
        }

        function submitComment() {
            let commentInput = document.getElementById("commentInput");
            let commentsList = document.getElementById("commentsList");

            if (commentInput.value.trim() !== "") {
                let newComment = document.createElement("div");
                newComment.classList.add("comment");
                newComment.innerHTML = `
                    <p><strong>Rating:</strong> <span class="rating">${"&#9733;".repeat(selectedRating)}</span></p>
                    <p>${commentInput.value}</p>
                `;
                commentsList.appendChild(newComment);
                ratings.push(selectedRating); // Add the selected rating to the ratings array
                updateOverallRating(); // Update the overall rating
                commentInput.value = ""; // Clear input
                selectedRating = 0; // Reset selected rating
                updateStars(); // Reset stars
            } else {
                alert("Please enter a comment.");
            }
        }

        // Generate the pie chart when the page loads
        window.onload = generateRandomPie;

    </script>
<footer>
<p> <a href="tigervibez.html" target="BLANK">homePage</a></p>
</footer>
<h2>Leave a Comment</h2>
<form id="commentForm">
<textarea name="comment" placeholder="Write your comment..." required=""></textarea><br/>
<button type="submit">Submit</button>
</form>
<div id="commentStatus"></div>
<h3>Comments</h3>
<ul id="commentsList"></ul>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const form = document.getElementById("commentForm");
  const statusDiv = document.getElementById("commentStatus");
  const commentsList = document.getElementById("commentsList");
  const teacher = "Kamal Ali";

  // Submit new comment
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    const comment = form.comment.value;

    try {
      const response = await fetch("https://tiger-comments-api.onrender.com/comments", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ teacher: teacher, comment: comment })
      });
      const result = await response.json();
      statusDiv.textContent = result.message || "Comment submitted!";
      form.reset();
      loadComments(); // Refresh comment list
    } catch (error) {
      statusDiv.textContent = "Failed to submit comment.";
    }
  });

  // Load existing comments
  async function loadComments() {
    commentsList.innerHTML = "Loading comments...";
    try {
      const response = await fetch("https://tiger-comments-api.onrender.com/comments/" + encodeURIComponent(teacher));
      const data = await response.json();
      if (Array.isArray(data.comments)) {
        commentsList.innerHTML = data.comments.map(c => `<li>${c}</li>`).join('');
      } else {
        commentsList.innerHTML = "No comments found.";
      }
    } catch (err) {
      commentsList.innerHTML = "Failed to load comments.";
    }
  }

  loadComments();
});
</script>
</body>
</html>

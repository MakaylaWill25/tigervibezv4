    function filterTeachers() {
      const searchVal = document.getElementById("searchInput").value.toLowerCase();
      const collegeVal = document.getElementById("collegeFilter").value;
      const deptVal = document.getElementById("departmentFilter").value;

      const list = document.getElementById("teacherList");
      list.innerHTML = '';

      const filtered = teachers.filter(t => {
        return (!searchVal || t.name.toLowerCase().includes(searchVal)) &&
               (!collegeVal || t.college === collegeVal) &&
               (!deptVal || t.department === deptVal);
      });

      if (filtered.length === 0) {
        list.innerHTML = "<li>No matches found.</li>";
      } else {
        filtered.forEach(t => {
          const li = document.createElement("li");
          li.className = "container";
          li.innerHTML = `<a class="name" href="${t.filename}">${t.name}</a> - ${t.department} (${
            t.college })`;
          list.appendChild(li);
        });
      }
    }

    filterTeachers();
  </script>
